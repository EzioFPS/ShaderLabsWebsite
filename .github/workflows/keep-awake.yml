# Render's free plan sleeps a site after 15 minutes without traffic, making the next
# visitor wait ~50s. This pings it every 10 minutes so it stays awake.
# Set the repo variable SITE_URL (Settings > Secrets and variables > Actions > Variables).
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - run: curl -fsS -o /dev/null --retry 3 --retry-delay 10 --max-time 90 "${{ vars.SITE_URL }}"
